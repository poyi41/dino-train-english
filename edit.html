<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>編輯模式 - 恐龍火車學英文</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦖</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="edit-mode">
  <!-- 大人才能進入 -->
  <main id="gate" class="page gate" hidden>
    <h1>🔒 大人專用</h1>
    <p id="gate-question" class="gate-question"></p>
    <form id="gate-form" class="gate-form">
      <input id="gate-answer" type="number" inputmode="numeric" autocomplete="off" required>
      <button class="big-btn" type="submit">進入</button>
    </form>
    <p id="gate-error" class="message error" hidden>答錯了，再試一次</p>
    <a class="big-btn home-link" href="index.html">🏠 回首頁</a>
  </main>

  <!-- 選擇要編輯的集數 -->
  <main id="picker" class="page" hidden>
    <header class="top-bar">
      <h1 class="page-title">✏️ 編輯模式</h1>
      <a class="big-btn" href="index.html">🏠</a>
    </header>
    <div id="picker-list" class="picker-list"></div>

    <h2>新增一集</h2>
    <form id="new-form" class="new-form">
      <input id="new-video" type="text" placeholder="貼上 YouTube 網址或 11 碼影片 ID" required>
      <button class="big-btn" type="submit">➕ 新增</button>
    </form>
    <p id="picker-status" class="message" hidden></p>
  </main>

  <!-- 編輯單集 -->
  <div id="editor" hidden>
    <div class="video-bar">
      <div class="video-bar-inner edit-video-layout">
        <div class="video-col">
          <div class="video-frame">
            <div id="player"></div>
          </div>
          <div class="video-tools">
            <button type="button" data-seek="-5">⏪ 5s</button>
            <button type="button" data-seek="-1">◀ 1s</button>
            <span id="now" class="now">0:00.0</span>
            <button type="button" data-seek="1">1s ▶</button>
            <button type="button" data-seek="5">5s ⏩</button>
          </div>
        </div>
        <aside id="captions" class="caption-panel" hidden></aside>
      </div>
    </div>

    <main class="page">
      <section class="edit-section">
        <h2>基本資料 <span id="ep-id" class="hint"></span></h2>
        <div id="meta" class="meta-grid"></div>
      </section>

      <section class="edit-section">
        <h2>💬 句子
          <button type="button" id="sort-sentences" class="small-btn">依時間排序</button>
          <span id="sentences-core" class="core-count"></span>
        </h2>
        <p class="hint">影片播到句子開頭按開始的 ⏱，講完按結束的 ⏱，再按 ▶ 試播確認。</p>
        <div id="sentences"></div>
        <button type="button" id="add-sentence" class="small-btn add-btn">➕ 新增句子（從目前時間）</button>
      </section>

      <section class="edit-section">
        <h2>🔤 單字
          <button type="button" id="sort-words" class="small-btn">依時間排序</button>
          <span id="words-core" class="core-count"></span>
        </h2>
        <p class="hint">勾 ⭐ core 的項目在單集頁直接顯示（單字最多 4 個、句子最多 3 句），其他收在「更多」。整集都沒勾就全部顯示。</p>
        <div id="words"></div>
        <button type="button" id="add-word" class="small-btn add-btn">➕ 新增單字（從目前時間）</button>
      </section>

      <section class="edit-section">
        <h2>🦕 恐龍</h2>
        <div id="dinosaurs"></div>
        <button type="button" id="add-dino" class="small-btn add-btn">➕ 新增恐龍</button>
      </section>

      <section class="edit-section">
        <h2>📖 小故事</h2>
        <p class="hint">用自己的話重述這集，3～5 句、每句 8 個字以內，多用重複句型和高頻字（the, is, a, see, can, big）。</p>
        <div id="story"></div>
        <button type="button" id="add-story" class="small-btn add-btn">➕ 新增一句</button>
      </section>
    </main>

    <footer class="save-bar">
      <a class="small-btn" href="edit.html">↩ 集數列表</a>
      <a id="preview-link" class="small-btn" href="#" target="_blank">👀 孩子看到的畫面</a>
      <span id="save-status" class="save-status"></span>
      <button type="button" id="save" class="big-btn">💾 儲存</button>
    </footer>
  </div>

  <script type="module" src="js/edit.js"></script>
</body>
</html>
