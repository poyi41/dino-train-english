<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>恐龍火車學英文</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦖</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="video-bar">
    <div class="video-bar-inner">
      <a class="big-btn home-btn" href="index.html" aria-label="回首頁">🏠</a>
      <div class="video-frame">
        <div id="player"></div>
      </div>
    </div>
  </div>

  <main class="page">
    <h1 class="episode-title">
      <span id="ep-title-en" class="en"></span>
      <span id="ep-title-zh" class="zh"></span>
    </h1>
    <p id="status" class="message">載入中…</p>

    <!-- 看片進度：小火車開到終點就算看完 -->
    <div id="watch-progress" class="watch-progress" hidden>
      <div class="watch-track"><span id="watch-train" class="watch-train">🚂</span></div>
      <span id="watch-goal" class="watch-goal">🏁</span>
    </div>

    <section id="words-section" class="section" hidden>
      <h2 class="section-title">🔤 Words</h2>
      <div id="words" class="word-grid"></div>
    </section>

    <section id="sentences-section" class="section" hidden>
      <h2 class="section-title">💬 Say it!</h2>
      <div id="sentences" class="sentence-list"></div>
    </section>

    <!-- 例如在電視上看過時大人手動標記；誤標時可以取消 -->
    <button type="button" id="adult-mark" class="adult-mark">大人用：標記這集已看完</button>
  </main>

  <script type="module" src="js/episode.js"></script>
</body>
</html>
